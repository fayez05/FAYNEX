<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Meta -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FAYNEX | Categories</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../images/favicon.png">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/categories.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="admin-dashboard">

    <!-- ================= Sidebar ================= -->

    <aside class="sidebar">

        <div class="logo">

            <a href="dashboard.html">

                <img src="../images/FAYNEX-logo.png" alt="FAYNEX Logo">

            </a>

        </div>

        <ul class="sidebar-menu">

            <li>
                <a href="dashboard.html">
                    <i class="fa-solid fa-gauge-high"></i>
                    Dashboard
                </a>
            </li>

            <li>
                <a href="products.html">
                    <i class="fa-solid fa-box"></i>
                    Products
                </a>
            </li>

            <li class="active">
                <a href="categories.html">
                    <i class="fa-solid fa-layer-group"></i>
                    <span>Categories</span>
                </a>
            </li>

            <li>
                <a href="add-product.html">
                    <i class="fa-solid fa-square-plus"></i>
                    Add Product
                </a>
            </li>

            <li>
                <a href="orders.html">
                    <i class="fa-solid fa-cart-shopping"></i>
                    Orders
                </a>
            </li>

            <li>
                <a href="customers.html">
                    <i class="fa-solid fa-users"></i>
                    Customers
                </a>
            </li>

            <li>
                <a href="reports.html">
                    <i class="fa-solid fa-chart-line"></i>
                    Reports
                </a>
            </li>

            <li>
                <a href="settings.html">
                    <i class="fa-solid fa-gear"></i>
                    Settings
                </a>
            </li>

        </ul>

        <div class="logout">

            <a href="../pages/login.html">

                <i class="fa-solid fa-right-from-bracket"></i>

                Logout

            </a>

        </div>

    </aside>

        <!-- ================= Main Content ================= -->

    <main class="dashboard-content">

    <!-- ================= Header ================= -->

    <header class="dashboard-header">

        <div>

            <h1>Categories</h1>

            <p>Manage your product categories</p>

        </div>

        <div class="header-tools">

            <div class="search-box">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input type="text" id="categories-search" placeholder="Search categories..." aria-label="Search categories">

            </div>

            <a href="add-product.html" class="add-btn">

                <i class="fa-solid fa-plus"></i>

                Add Product

            </a>

        </div>

    </header>

    <!-- ================= Categories Statistics ================= -->

    <section class="categories-grid">

        <div class="category-card">

            <i class="fa-solid fa-layer-group"></i>

            <h3>Total Categories</h3>

            <span id="total-categories">0 Categories</span>

        </div>

        <div class="category-card">

            <i class="fa-solid fa-box-open"></i>

            <h3>Total Products</h3>

            <span id="total-category-products">0 Products</span>

        </div>

        <div class="category-card">

            <i class="fa-solid fa-star"></i>

            <h3>Top Category</h3>

            <span id="top-category">-</span>

        </div>

    </section>

    <!-- ================= Categories Table ================= -->

    <section class="products-table">

        <table>

            <thead>

                <tr>

                    <th>Icon</th>
                    <th>Category</th>
                    <th>Products</th>
                    <th>Status</th>
                    <th>In Stock</th>
                    <th>Actions</th>

                </tr>

            </thead>

            <tbody id="categories-body">

            </tbody>

        </table>

    </section>

    <!-- ================= Pagination ================= -->

    <div class="pagination" id="categories-pagination" hidden></div>

</main>

<!-- JavaScript -->

<script src="../js/main.js"></script>
<script src="../js/products.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/admin-categories.js"></script>

</body>

</html>
