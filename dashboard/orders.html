<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Meta -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FAYNEX | Orders</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../images/favicon.png">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/orders.css">
    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="admin-dashboard">

    <!-- ================= Sidebar ================= -->

    <aside class="sidebar">

        <div class="logo">

            <a href="dashboard.html">

                <img src="../images/FAYNEX-logo.png" alt="FAYNEX Logo">

            </a>

        </div>

        <ul class="sidebar-menu">

            <li>
                <a href="dashboard.html">
                    <i class="fa-solid fa-gauge-high"></i>
                    Dashboard
                </a>
            </li>

            <li>
                <a href="products.html">
                    <i class="fa-solid fa-box"></i>
                    Products
                </a>
            </li>

            <li>
                <a href="categories.html">
                    <i class="fa-solid fa-layer-group"></i>
                    <span>Categories</span>
                </a>
            </li>

            <li>
                <a href="add-product.html">
                    <i class="fa-solid fa-square-plus"></i>
                    Add Product
                </a>
            </li>

            <li class="active">
                <a href="orders.html">
                    <i class="fa-solid fa-cart-shopping"></i>
                    Orders
                </a>
            </li>

            <li>
                <a href="customers.html">
                    <i class="fa-solid fa-users"></i>
                    Customers
                </a>
            </li>

            <li>
                <a href="reports.html">
                    <i class="fa-solid fa-chart-line"></i>
                    Reports
                </a>
            </li>

            <li>
                <a href="settings.html">
                    <i class="fa-solid fa-gear"></i>
                    Settings
                </a>
            </li>

        </ul>

        <div class="logout">

            <a href="../pages/login.html">

                <i class="fa-solid fa-right-from-bracket"></i>

                Logout

            </a>

        </div>

    </aside>

        <!-- ================= Main Content ================= -->

    <main class="dashboard-content">

    <!-- ================= Header ================= -->

    <header class="dashboard-header">

        <div>

            <h1>Orders</h1>

            <p>Manage customer orders</p>

        </div>

        <div class="header-tools">

            <div class="search-box">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input type="text" id="orders-search" placeholder="Search orders..." aria-label="Search orders">

            </div>

        </div>

    </header>

    <!-- ================= Order Status ================= -->

    <section class="categories-grid">

        <div class="category-card" data-filter="Pending">

            <i class="fa-solid fa-box"></i>

            <h3>Pending</h3>

            <span id="count-pending">0 Orders</span>

        </div>

        <div class="category-card" data-filter="Shipped">

            <i class="fa-solid fa-truck"></i>

            <h3>Shipped</h3>

            <span id="count-shipped">0 Orders</span>

        </div>

        <div class="category-card" data-filter="Delivered">

            <i class="fa-solid fa-circle-check"></i>

            <h3>Delivered</h3>

            <span id="count-delivered">0 Orders</span>

        </div>

        <div class="category-card" data-filter="Cancelled">

            <i class="fa-solid fa-circle-xmark"></i>

            <h3>Cancelled</h3>

            <span id="count-cancelled">0 Orders</span>

        </div>

    </section>

    <!-- ================= Orders Table ================= -->

    <section class="products-table">

        <table>

            <thead>

                <tr>

                    <th>Order ID</th>
                    <th>Customer</th>
                    <th>Date</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th>Payment</th>
                    <th>Actions</th>

                </tr>

            </thead>

            <tbody id="orders-body">

            </tbody>

        </table>

    </section>

    <!-- ================= Pagination ================= -->

    <div class="pagination" id="orders-pagination"></div>

</main>

<!-- JavaScript -->

<script src="../js/main.js"></script>
<script src="../js/products.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/admin-orders.js"></script>

</body>

</html>
