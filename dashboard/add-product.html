<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Meta -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FAYNEX | Add Product</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../images/favicon.png">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/add-product.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="admin-dashboard">

    <!-- ================= Sidebar ================= -->

    <aside class="sidebar">

        <div class="logo">

            <a href="dashboard.html">

                <img src="../images/FAYNEX-logo.png" alt="FAYNEX Logo">

            </a>

        </div>

        <ul class="sidebar-menu">

            <li>
                <a href="dashboard.html">
                    <i class="fa-solid fa-gauge-high"></i>
                    Dashboard
                </a>
            </li>

            <li>
                <a href="products.html">
                    <i class="fa-solid fa-box"></i>
                    Products
                </a>
            </li>

            <li>
                <a href="categories.html">
                    <i class="fa-solid fa-layer-group"></i>
                    <span>Categories</span>
                </a>
            </li>

            <li class="active">
                <a href="add-product.html">
                    <i class="fa-solid fa-square-plus"></i>
                    Add Product
                </a>
            </li>

            <li>
                <a href="orders.html">
                    <i class="fa-solid fa-cart-shopping"></i>
                    Orders
                </a>
            </li>

            <li>
                <a href="customers.html">
                    <i class="fa-solid fa-users"></i>
                    Customers
                </a>
            </li>

            <li>
                <a href="reports.html">
                    <i class="fa-solid fa-chart-line"></i>
                    Reports
                </a>
            </li>

            <li>
                <a href="settings.html">
                    <i class="fa-solid fa-gear"></i>
                    Settings
                </a>
            </li>

        </ul>

        <div class="logout">

            <a href="../pages/login.html">

                <i class="fa-solid fa-right-from-bracket"></i>

                Logout

            </a>

        </div>

    </aside>

        <!-- ================= Main Content ================= -->

    <main class="dashboard-content">

    <!-- ================= Header ================= -->

    <header class="dashboard-header">

        <div>

            <h1 id="product-form-title">Add Product</h1>

            <p id="product-form-subtitle">Add a new product to your store</p>

        </div>

    </header>

    <!-- ================= Add Product Form ================= -->

    <section class="settings-card">

        <h2>Product Information</h2>

        <form class="product-form" id="product-form" novalidate>

            <div class="input-group">

                <label for="product-name">Product Name</label>

                <input type="text" id="product-name" name="name" placeholder="Enter product name" required>

            </div>

            <div class="input-group">

                <label for="product-category">Category</label>

                    <select id="product-category" name="category" required>
                        <option value="smartphones">Smartphones</option>
                        <option value="laptops">Laptops</option>
                        <option value="tvs">TVs</option>
                        <option value="smart-watches">Smart Watches</option>
                        <option value="accessories">Accessories</option>
                        <option value="gaming">Gaming</option>
                    </select>

            </div>

            <div class="input-group">

                <label for="product-brand">Brand</label>

                <input type="text" id="product-brand" name="brand" placeholder="Apple, Samsung...">

            </div>

            <div class="input-group">

                <label for="product-price">Price ($)</label>

                <input type="number" id="product-price" name="price" placeholder="0.00" min="1" step="0.01" required>

            </div>

            <div class="input-group">

                <label for="product-discount">Discount (%)</label>

                <input type="number" id="product-discount" name="discount" placeholder="0" min="0" max="90" step="1">

            </div>

            <div class="input-group">

                <label for="product-stock">Stock Quantity</label>

                <input type="number" id="product-stock" name="stock" placeholder="0" min="0" step="1" required>

            </div>

            <div class="input-group">

                <label for="product-sku">Product SKU</label>

                <input type="text" id="product-sku" name="sku" placeholder="SKU-1001">

            </div>

            <div class="input-group">

                <label for="product-status">Status</label>

                    <select id="product-status" name="status">
                        <option value="Active">Active</option>
                        <option value="Hidden">Hidden</option>
                    </select>

            </div>

            <div class="input-group full-width">

                <label for="product-description">Description</label>

                <textarea id="product-description" name="description" rows="6" placeholder="Write product description..." required></textarea>

            </div>

            <div class="input-group full-width">

                <label>Available Colors</label>

                <div class="colors-group">

                    <label><input type="checkbox" name="colors" value="Black"> Black</label>

                    <label><input type="checkbox" name="colors" value="White"> White</label>

                    <label><input type="checkbox" name="colors" value="Blue"> Blue</label>

                    <label><input type="checkbox" name="colors" value="Silver"> Silver</label>

                    <label><input type="checkbox" name="colors" value="Red"> Red</label>

                </div>

            </div>

            <div class="input-group full-width">

                <label for="product-image">Product Image</label>
                <input type="file" id="product-image" name="image" accept="image/*">

                    <img id="product-image-preview" class="image-preview" alt="Product image preview" hidden>

            </div>

            <div class="button-group">

                <button type="submit" class="save-btn">

                    <i class="fa-solid fa-floppy-disk"></i>

                    Save Product

                </button>

                <button type="button" class="cancel-btn" id="product-cancel-btn">

                    Cancel

                </button>

            </div>

        </form>

    </section>


</main>

<!-- JavaScript -->

<script src="../js/main.js"></script>
<script src="../js/products.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/admin-add-product.js"></script>

</body>

</html>
